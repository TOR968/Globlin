name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            asset: globlin.exe
          - runner: windows-11-arm
            asset: globlin-arm64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
          ./rustup-init.exe -y --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Add-Content $env:GITHUB_PATH

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Package the download
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/globlin.exe dist/${{ matrix.asset }}
          $hash = (Get-FileHash dist/${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Set-Content dist/${{ matrix.asset }}.sha256
          "sha256=$hash" | Add-Content $env:GITHUB_OUTPUT
          Get-ChildItem dist | Select-Object Name, Length

      - name: Scan the build with VirusTotal
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $section = & ./.github/virustotal-scan.ps1 -Path dist/${{ matrix.asset }} -Sha256 '${{ steps.package.outputs.sha256 }}'
          if ($section) { $section | Set-Content dist/${{ matrix.asset }}.virustotal.md -Encoding utf8 }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Confirm the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $pattern = '^version = "([^"]+)"'
          $manifest = (Select-String -Path Cargo.toml -Pattern $pattern).Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag $tag does not match the Cargo.toml version $manifest"
          }
          "releasing $manifest"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Assemble the release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $parts = @()
          $section = & ./.github/changelog-section.ps1 -Version $version
          if ($section) {
            $parts += $section
          } else {
            "no CHANGELOG.md section found for $version; using the static notes only"
          }
          $parts += (Get-Content .github/release-notes.md -Raw).Trim()
          foreach ($asset in 'globlin.exe', 'globlin-arm64.exe') {
            $scan = "dist/$asset.virustotal.md"
            if (Test-Path $scan) {
              $parts += (Get-Content $scan -Raw).Trim()
            }
          }
          ($parts -join "`n`n") | Set-Content dist/notes.md -Encoding utf8

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/globlin.exe
          dist/globlin.exe.sha256
          dist/globlin-arm64.exe
          dist/globlin-arm64.exe.sha256
          --title "Globlin ${{ github.ref_name }}"
          --notes-file dist/notes.md
