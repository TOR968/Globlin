name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            asset: globlin.exe
          - runner: windows-11-arm
            asset: globlin-arm64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
          ./rustup-init.exe -y --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Add-Content $env:GITHUB_PATH

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Package the download
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/globlin.exe dist/${{ matrix.asset }}
          $hash = (Get-FileHash dist/${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Add-Content $env:GITHUB_OUTPUT
          $icon = Get-ChildItem target/release/build -Recurse -Filter app.ico |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $icon.FullName dist/${{ matrix.asset }}.ico
          Get-ChildItem dist | Select-Object Name, Length

      - name: Scan the build with VirusTotal
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $section = & ./.github/virustotal-scan.ps1 -Path dist/${{ matrix.asset }} -Sha256 '${{ steps.package.outputs.sha256 }}'
          if ($section) { $section | Set-Content dist/${{ matrix.asset }}.virustotal.md -Encoding utf8 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build Globlin.app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Bundle, sign ad hoc and zip
        run: |
          bash .github/bundle-macos.sh target/release/globlin dist
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/globlin-macos-apple-silicon.zip
          if-no-files-found: error

  build-linux:
    name: Build the Linux packages (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the native libraries Globlin links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test
        run: cargo test

      - name: Package the deb and the rpm
        run: bash .github/package-linux.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, build-macos, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = $env:TAG -replace '^v', ''
          $pattern = '^version = "([^"]+)"'
          $manifest = (Select-String -Path Cargo.toml -Pattern $pattern).Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag $tag does not match the Cargo.toml version $manifest"
          }
          "releasing $manifest"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($build in @(@{ Exe = 'globlin.exe'; Arch = 'x64' }, @{ Exe = 'globlin-arm64.exe'; Arch = 'arm64' })) {
            & ./.github/build-installer.ps1 -Exe "dist/$($build.Exe)" -Arch $build.Arch -Icon "dist/$($build.Exe).ico" -OutDir dist
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Scan the installers with VirusTotal
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          foreach ($name in 'globlin-setup-x64.exe', 'globlin-setup-arm64.exe') {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            $section = & ./.github/virustotal-scan.ps1 -Path "dist/$name" -Sha256 $hash
            if ($section) { $section | Set-Content "dist/$name.virustotal.md" -Encoding utf8 }
          }

      - name: Render the Arch PKGBUILD
        shell: bash
        run: |
          version="${TAG#v}"
          bash .github/render-pkgbuild.sh "$version" "$(sha256sum dist/globlin-amd64.deb | cut -d' ' -f1)" "$(sha256sum dist/globlin-arm64.deb | cut -d' ' -f1)" pkgbuild
          cp pkgbuild/PKGBUILD dist/globlin-bin.PKGBUILD

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $files = 'globlin-setup-x64.exe', 'globlin-setup-arm64.exe', 'globlin.exe', 'globlin-arm64.exe', 'globlin-macos-apple-silicon.zip', 'globlin-amd64.deb', 'globlin-arm64.deb', 'globlin-x86_64.rpm', 'globlin-aarch64.rpm', 'globlin-bin.PKGBUILD'
          $lines = foreach ($name in $files) {
            "$((Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower())  $name"
          }
          (($lines -join "`n") + "`n") | Set-Content dist/SHA256SUMS -NoNewline
          Get-Content dist/SHA256SUMS

      - name: Sign the release files
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --quiet "cryptography==50.0.1"
          python .github/minisign-sign.py dist/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

      - name: Assemble the release notes
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $notes = (Get-Content .github/release-notes.md -Raw).Trim()
          if (-not $notes.Contains('@CHANGELOG@')) {
            throw ".github/release-notes.md has lost its @CHANGELOG@ placeholder"
          }
          $section = & ./.github/changelog-section.ps1 -Version $version
          if ($section) {
            $changes = "## What's changed`n`n$section"
          } else {
            "no CHANGELOG.md section found for $version; using the static notes only"
            $changes = ''
          }
          $parts = @(($notes.Replace('@TAG@', $env:TAG).Replace('@CHANGELOG@', $changes) -replace '(\r?\n){3,}', "`n`n").Trim())
          foreach ($asset in 'globlin-setup-x64.exe', 'globlin-setup-arm64.exe', 'globlin.exe', 'globlin-arm64.exe') {
            $scan = "dist/$asset.virustotal.md"
            if (Test-Path $scan) {
              $parts += (Get-Content $scan -Raw).Trim()
            }
          }
          ($parts -join "`n`n") | Set-Content dist/notes.md -Encoding utf8

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:TAG
          dist/globlin-setup-x64.exe
          dist/globlin-setup-arm64.exe
          dist/globlin.exe
          dist/globlin-arm64.exe
          dist/globlin-macos-apple-silicon.zip
          dist/globlin-amd64.deb
          dist/globlin-arm64.deb
          dist/globlin-x86_64.rpm
          dist/globlin-aarch64.rpm
          dist/globlin-bin.PKGBUILD
          dist/SHA256SUMS
          dist/SHA256SUMS.minisig
          --title "Globlin $env:TAG"
          --notes-file dist/notes.md

  aur:
    name: Publish globlin-bin to the AUR
    needs: publish
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.AUR_SSH_KEY != ''
        with:
          persist-credentials: false

      - name: Render the PKGBUILD for this release
        if: env.AUR_SSH_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "v$version" --pattern SHA256SUMS --dir sums
          sha_amd64="$(awk '$2 == "globlin-amd64.deb" { print $1 }' sums/SHA256SUMS)"
          sha_arm64="$(awk '$2 == "globlin-arm64.deb" { print $1 }' sums/SHA256SUMS)"
          test -n "$sha_amd64"
          test -n "$sha_arm64"
          bash .github/render-pkgbuild.sh "$version" "$sha_amd64" "$sha_arm64" aur

      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.AUR_SSH_KEY != ''
        with:
          pkgname: globlin-bin
          pkgbuild: aur/PKGBUILD
          commit_username: TOR968
          commit_email: ${{ vars.AUR_COMMIT_EMAIL || 'TOR968@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Update to ${{ github.ref_name }}
