name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            asset: globlin.exe
          - runner: windows-11-arm
            asset: globlin-arm64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
          ./rustup-init.exe -y --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Add-Content $env:GITHUB_PATH

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Package the download
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/globlin.exe dist/${{ matrix.asset }}
          $hash = (Get-FileHash dist/${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Set-Content dist/${{ matrix.asset }}.sha256
          "sha256=$hash" | Add-Content $env:GITHUB_OUTPUT
          $icon = Get-ChildItem target/release/build -Recurse -Filter app.ico |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $icon.FullName dist/${{ matrix.asset }}.ico
          Get-ChildItem dist | Select-Object Name, Length

      - name: Scan the build with VirusTotal
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $section = & ./.github/virustotal-scan.ps1 -Path dist/${{ matrix.asset }} -Sha256 '${{ steps.package.outputs.sha256 }}'
          if ($section) { $section | Set-Content dist/${{ matrix.asset }}.virustotal.md -Encoding utf8 }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build Globlin.app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Bundle, sign ad hoc and zip
        run: |
          bash .github/bundle-macos.sh target/release/globlin dist
          cd dist
          for file in globlin-macos-arm64 Globlin-macos-arm64.zip; do
            shasum -a 256 "$file" > "$file.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/globlin-macos-arm64
            dist/globlin-macos-arm64.sha256
            dist/Globlin-macos-arm64.zip
            dist/Globlin-macos-arm64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, build-macos]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Confirm the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $pattern = '^version = "([^"]+)"'
          $manifest = (Select-String -Path Cargo.toml -Pattern $pattern).Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag $tag does not match the Cargo.toml version $manifest"
          }
          "releasing $manifest"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($build in @(@{ Exe = 'globlin.exe'; Arch = 'x64' }, @{ Exe = 'globlin-arm64.exe'; Arch = 'arm64' })) {
            $setup = & ./.github/build-installer.ps1 -Exe "dist/$($build.Exe)" -Arch $build.Arch -Icon "dist/$($build.Exe).ico" -OutDir dist
            $name = Split-Path $setup -Leaf
            $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "dist/$name.sha256"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Scan the installers with VirusTotal
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          foreach ($name in 'globlin-setup-x64.exe', 'globlin-setup-arm64.exe') {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            $section = & ./.github/virustotal-scan.ps1 -Path "dist/$name" -Sha256 $hash
            if ($section) { $section | Set-Content "dist/$name.virustotal.md" -Encoding utf8 }
          }

      - name: Assemble the release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $parts = @()
          $section = & ./.github/changelog-section.ps1 -Version $version
          if ($section) {
            $parts += $section
          } else {
            "no CHANGELOG.md section found for $version; using the static notes only"
          }
          $parts += (Get-Content .github/release-notes.md -Raw).Trim()
          foreach ($asset in 'globlin-setup-x64.exe', 'globlin-setup-arm64.exe', 'globlin.exe', 'globlin-arm64.exe') {
            $scan = "dist/$asset.virustotal.md"
            if (Test-Path $scan) {
              $parts += (Get-Content $scan -Raw).Trim()
            }
          }
          ($parts -join "`n`n") | Set-Content dist/notes.md -Encoding utf8

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/globlin.exe
          dist/globlin.exe.sha256
          dist/globlin-arm64.exe
          dist/globlin-arm64.exe.sha256
          dist/globlin-setup-x64.exe
          dist/globlin-setup-x64.exe.sha256
          dist/globlin-setup-arm64.exe
          dist/globlin-setup-arm64.exe.sha256
          dist/Globlin-macos-arm64.zip
          dist/Globlin-macos-arm64.zip.sha256
          dist/globlin-macos-arm64
          dist/globlin-macos-arm64.sha256
          --title "Globlin ${{ github.ref_name }}"
          --notes-file dist/notes.md
