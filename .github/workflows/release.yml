name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish a tagged build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Confirm the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $pattern = '^version = "([^"]+)"'
          $manifest = (Select-String -Path Cargo.toml -Pattern $pattern).Matches[0].Groups[1].Value
          if ($tag -ne $manifest) {
            throw "tag $tag does not match the Cargo.toml version $manifest"
          }
          "releasing $manifest"

      - name: Test
        run: cargo test

      - name: Build the release binary
        run: cargo build --release

      - name: Package the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/globlin.exe dist/
          $hash = (Get-FileHash dist/globlin.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  globlin.exe" | Set-Content dist/globlin.exe.sha256
          Get-ChildItem dist | Select-Object Name, Length

      - name: Assemble the release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $parts = @()
          $section = & ./.github/changelog-section.ps1 -Version $version
          if ($section) {
            $parts += $section
          } else {
            "no CHANGELOG.md section found for $version; using the static notes only"
          }
          $parts += (Get-Content .github/release-notes.md -Raw).Trim()
          ($parts -join "`n`n") | Set-Content dist/notes.md -Encoding utf8

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/globlin.exe
          dist/globlin.exe.sha256
          --title "Globlin ${{ github.ref_name }}"
          --notes-file dist/notes.md
