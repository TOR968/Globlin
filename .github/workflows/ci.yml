name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "site/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --check

  build:
    name: Build and test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            asset: globlin.exe
          - name: Windows ARM64
            runner: windows-11-arm
            asset: globlin-arm64.exe
          - name: macOS ARM64
            runner: macos-latest
          - name: Linux x64
            runner: ubuntu-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the native libraries the tray links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Install the Rust toolchain
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
          ./rustup-init.exe -y --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Add-Content $env:GITHUB_PATH

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install clippy
        run: rustup component add clippy

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install the packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package the deb and the rpm, then install and remove the deb
        if: runner.os == 'Linux'
        run: |
          bash .github/package-linux.sh linux-out
          sudo apt-get install -y rpm
          rpm -qp --requires linux-out/*.rpm
          sudo apt-get install -y ./linux-out/globlin-$(dpkg --print-architecture).deb
          test -x /usr/bin/globlin
          test -f /usr/share/applications/globlin.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/globlin.png
          sudo apt-get remove -y globlin
          test ! -e /usr/bin/globlin

      - name: Build the AUR package from the deb and install it on Arch
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bash .github/aur-smoke.sh linux-out/globlin-amd64.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: globlin-linux-${{ runner.arch }}-${{ github.sha }}
          path: linux-out/*
          if-no-files-found: error

      - name: Bundle Globlin.app and verify its signature
        if: runner.os == 'macOS'
        run: |
          cargo build --release
          bash .github/bundle-macos.sh target/release/globlin macos-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: globlin-macos-apple-silicon-${{ github.sha }}
          path: macos-out/globlin-macos-apple-silicon.zip
          if-no-files-found: error

      - name: Build the release binary
        if: matrix.asset
        run: cargo build --release

      - name: Report the binary size
        if: matrix.asset
        shell: pwsh
        run: |
          $exe = Get-Item target/release/globlin.exe
          "{0:N0} bytes ({1:N2} MB)" -f $exe.Length, ($exe.Length / 1MB)

      - name: Build the installer and run it through an install and an uninstall
        if: matrix.asset == 'globlin.exe'
        shell: pwsh
        run: |
          $icon = Get-ChildItem target/release/build -Recurse -Filter app.ico |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = & ./.github/build-installer.ps1 -Exe target/release/globlin.exe -Arch x64 -Icon $icon.FullName -OutDir installer-out
          & ./.github/installer-smoke.ps1 -Setup $setup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.asset == 'globlin.exe'
        with:
          name: globlin-setup-x64.exe-${{ github.sha }}
          path: installer-out/globlin-setup-x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.asset
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: target/release/globlin.exe
          if-no-files-found: error
