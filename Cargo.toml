[package]
name = "globlin"
version = "0.2.9"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Watches your global npm and bun packages and tells you when one falls behind"
authors = ["TOR968"]
repository = "https://github.com/TOR968/Globlin"
homepage = "https://globlin.pages.dev"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
tao = "0.37"
tray-icon = "0.24"
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
semver = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
