[package]
name = "npm-globals-tray"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.36"
tray-icon = "0.24"
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
